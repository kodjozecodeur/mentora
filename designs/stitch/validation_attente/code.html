<!-- Simple JS to cycle loading messages -->
<script>
                const statuses = [
                    "Analyse sémantique...",
                    "Vérification des concepts...",
                    "Calcul du score de maîtrise...",
                    "Préparation des retours..."
                ];
                let currentIndex = 0;
                const statusElement = document.getElementById('loading-status');
                
                setInterval(() => {
                    currentIndex = (currentIndex + 1) % statuses.length;
                    statusElement.textContent = statuses[currentIndex];
                    statusElement.style.opacity = 0;
                    setTimeout(() => {
                        statusElement.style.transition = 'opacity 0.3s ease';
                        statusElement.style.opacity = 1;
                    }, 50);
                }, 1500);
            </script>
