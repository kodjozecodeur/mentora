<!doctype html>

<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <style>
      .animate-spin-slow {
        animation: spin 3s linear infinite;
      }
      .pulse-subtle {
        animation: pulse-op 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse-op {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }
      .bounce-slight {
        animation: bounce-sl 2s infinite ease-in-out;
      }
      @keyframes bounce-sl {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background text-on-background font-body-md flex min-h-screen flex-col overflow-hidden"
  >
    <!-- Content Canvas (Loading Screen) -->
    <main class="p-container-padding relative flex flex-grow flex-col items-center justify-center">
      <!-- Background decorative elements -->
      <div
        class="pointer-events-none absolute inset-0 flex items-center justify-center overflow-hidden opacity-20"
      >
        <div
          class="max-h-lg bg-primary-container absolute -top-1/4 -right-1/4 h-[80vw] w-[80vw] max-w-lg rounded-full blur-3xl"
        ></div>
        <div
          class="max-h-md bg-secondary absolute -bottom-1/4 -left-1/4 h-[60vw] w-[60vw] max-w-md rounded-full blur-3xl"
        ></div>
      </div>
      <div class="space-y-lg z-10 flex w-full max-w-[500px] flex-col items-center text-center">
        <!-- Mentora Robot Avatar Area -->
        <div class="bounce-slight relative flex h-48 w-48 items-center justify-center">
          <!-- Inner glow -->
          <div
            class="bg-primary-container/20 pulse-subtle absolute inset-0 rounded-full blur-xl"
          ></div>
          <!-- Circular Loader (Outer Ring) -->
          <svg
            class="animate-spin-slow text-secondary absolute inset-0 h-full w-full"
            viewbox="0 0 100 100"
          >
            <circle
              class="opacity-30"
              cx="50"
              cy="50"
              fill="none"
              r="45"
              stroke="currentColor"
              stroke-dasharray="200"
              stroke-dashoffset="100"
              stroke-linecap="round"
              stroke-width="4"
            ></circle>
            <circle
              cx="50"
              cy="50"
              fill="none"
              r="45"
              stroke="currentColor"
              stroke-dasharray="283"
              stroke-dashoffset="200"
              stroke-linecap="round"
              stroke-width="4"
            ></circle>
          </svg>
          <!-- Inner Dashed Ring -->
          <svg
            class="animate-spin-slow text-primary-container absolute inset-4 h-[calc(100%-32px)] w-[calc(100%-32px)]"
            style="animation-direction: reverse; animation-duration: 4s"
            viewbox="0 0 100 100"
          >
            <circle
              cx="50"
              cy="50"
              fill="none"
              r="45"
              stroke="currentColor"
              stroke-dasharray="10 15"
              stroke-linecap="round"
              stroke-width="3"
            ></circle>
          </svg>
          <!-- Avatar Image Placeholder -->
          <div
            class="bg-surface-container-high border-surface relative flex h-28 w-28 items-center justify-center overflow-hidden rounded-full border-4 shadow-md"
          >
            <img
              class="h-full w-full object-cover"
              data-alt="A friendly, modern 3D rendered educational robot avatar with a vibrant yellow and soft purple color scheme. The robot is looking thoughtful, perhaps holding a digital clipboard or with small glowing calculation symbols floating around its head. Minimalist light background, soft studio lighting."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuAtj7iJBd6Gw9e2KQL97X-EqLuyXvCJajlbZLOSFZqSprU1GWmxE9nVtN6B2Qe0QDC_LbATDmtFK1iolKpN5cExEsrMKaHJ-XZe6J1jnPoxiy45u3B7pJqk3ZiYvTx9lYWEURvvTxMaBrD9vYvJ9Pb7czCYKzNrz0sOLhIVqli3LNxR6s202ynt2r77KeN-ZCbi8pWmuqYkDf9MRa0RcleZRYzCk3VPqcl_-uQATpZLu1edeuQC8-c"
            />
          </div>
          <!-- Small status badge -->
          <div
            class="bg-primary-container text-on-primary-container border-surface absolute right-2 bottom-2 rounded-full border-2 p-2 shadow-sm"
          >
            <span class="material-symbols-outlined block text-[18px]">psychology</span>
          </div>
        </div>
        <!-- Typography Area -->
        <div class="space-y-sm">
          <h1 class="font-headline-xl text-headline-xl text-on-background">
            Génération de ton plan...
          </h1>
          <p class="font-body-lg text-body-lg text-on-surface-variant mx-auto max-w-sm">
            Notre IA analyse tes forces et tes faiblesses pour créer le parcours parfait.
          </p>
        </div>
        <!-- Processing Steps (Simulated) -->
        <div
          class="bg-surface p-md border-surface-container-highest mt-lg w-full rounded-xl border-2 shadow-[0_4px_6px_-1px_rgba(0,0,0,0.1)]"
        >
          <div class="space-y-stack-gap">
            <!-- Step 1 (Done) -->
            <div class="space-x-sm flex items-center opacity-60">
              <span class="material-symbols-outlined text-secondary">check_circle</span>
              <span class="font-label-lg text-label-lg text-on-surface"
                >Analyse des résultats du diagnostic</span
              >
            </div>
            <!-- Step 2 (Active) -->
            <div class="space-x-sm flex items-center">
              <span
                class="material-symbols-outlined text-primary-container animate-spin"
                style="animation-duration: 2s"
                >sync</span
              >
              <span class="font-label-lg text-label-lg text-on-surface pulse-subtle font-semibold"
                >Identification des lacunes clés</span
              >
            </div>
            <!-- Step 3 (Pending) -->
            <div class="space-x-sm flex items-center opacity-30">
              <span class="material-symbols-outlined text-outline">schedule</span>
              <span class="font-label-lg text-label-lg text-on-surface"
                >Création du planning de révision</span
              >
            </div>
          </div>
          <!-- Linear Progress Bar -->
          <div
            class="bg-surface-container-high mt-md relative h-3 w-full overflow-hidden rounded-full"
          >
            <div
              class="bg-primary-container absolute top-0 left-0 h-full rounded-full"
              style="width: 60%; transition: width 0.5s ease"
            ></div>
            <!-- Shine effect on progress bar -->
            <div
              class="absolute top-0 left-0 h-full w-10 -skew-x-12 transform animate-[slide_2s_infinite] bg-white/40 blur-sm"
            ></div>
          </div>
        </div>
      </div>
    </main>
    <style>
      @keyframes slide {
        0% {
          transform: translateX(-100%) skewX(-12deg);
        }
        100% {
          transform: translateX(500px) skewX(-12deg);
        }
      }
    </style>
    <script>
      // Simple script to simulate progression and redirect (optional/visual only)
      document.addEventListener('DOMContentLoaded', () => {
        const progressBar = document.querySelector('.bg-primary-container.rounded-full');
        const steps = document.querySelectorAll('.space-y-stack-gap > div');

        setTimeout(() => {
          // Update Step 2 to done
          steps[1].classList.remove('pulse-subtle');
          steps[1].classList.add('opacity-60');
          steps[1].querySelector('span.material-symbols-outlined').textContent = 'check_circle';
          steps[1]
            .querySelector('span.material-symbols-outlined')
            .classList.remove('animate-spin', 'text-primary-container');
          steps[1].querySelector('span.material-symbols-outlined').classList.add('text-secondary');
          steps[1].querySelector('span.font-label-lg').classList.remove('font-semibold');

          // Update Step 3 to active
          steps[2].classList.remove('opacity-30');
          steps[2].classList.add('pulse-subtle');
          steps[2].querySelector('span.material-symbols-outlined').textContent = 'sync';
          steps[2].querySelector('span.material-symbols-outlined').classList.remove('text-outline');
          steps[2]
            .querySelector('span.material-symbols-outlined')
            .classList.add('text-primary-container', 'animate-spin');
          steps[2].querySelector('span.font-label-lg').classList.add('font-semibold');

          // Advance progress bar
          progressBar.style.width = '90%';
        }, 3000);
      });
    </script>
  </body>
</html>
