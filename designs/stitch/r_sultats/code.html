<style>
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 20px;
            background-color: #F4CE1A;
            opacity: 0;
            animation: fall 3s ease-in infinite;
        }
        @keyframes fall {
            0% { opacity: 1; top: -10%; transform: rotateZ(0deg) rotateY(0deg); }
            100% { opacity: 0; top: 110%; transform: rotateZ(360deg) rotateY(360deg); }
        }
        .tactile-card {
            border: 2px solid theme('colors.surface-variant');
            box-shadow: 0 4px 0 theme('colors.surface-variant');
            transition: all 0.15s ease;
        }
        .tactile-btn {
            border-bottom: 4px solid #6a5800; /* Darker yellow for primary button depth */
            transition: all 0.1s ease-in-out;
        }
        .tactile-btn:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased pb-[100px] overflow-x-hidden relative">

<div class="fixed inset-0 pointer-events-none z-10 overflow-hidden hidden md:block" id="confetti-container"></div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding h-16 max-w-[720px] mx-auto bg-background flat no shadows">
<button aria-label="Menu" class="text-primary hover:bg-surface-container transition-colors p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="font-headline-xl text-headline-xl font-bold text-primary">Mentora</div>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-surface-container-highest cursor-pointer hover:bg-surface-container transition-colors">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="A small, friendly profile picture placeholder showing an abstract geometric character in vibrant yellow and purple tones on a white background, minimal and modern." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGUaLAcYxg2gmmVsV-DIUZxTvTpBosvxOyV8M2sWdQJ5cDU00DxeBVvhBp-xYRg5UccgSLaKcSOqECdOC7lV5FYMpYIvAIZHjcdjQcB7KTcqAROGs1td7Cg4zOSG7iD8SpKjOM9nw1n4qftiQxnXYtoKhLG3qb2bDIFa7xWOjNIDOGp8Ur0823nUu-swE7UrLMNPAYIr7JPwfANYRHnP2O1kidSZTglDFqjLi-DLgXZrQeked6Glo"/>
</div>

<div class="relative w-48 h-48 mb-stack-gap">

<img alt="Bot mascot celebrating" class="w-full h-full object-contain drop-shadow-xl" data-alt="A highly detailed, 3D rendered friendly robot mascot character celebrating with a huge smile. The robot is primarily white with vibrant yellow (#F4CE1A) and purple (#8D3C9A) accents. It is throwing confetti in the air. The style is modern, tactile, and brightly lit, suitable for an educational app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCMXseTrsW-jlLjjPegp1A9qbuvluqZy1bcQ6Bf6A7i-z5VqtBYk3OIAcSv7kg_jcKwDa00g6YROpijUvPaNbjVtRzckHXSw_2W9vLQLSC4oSIXYx_nbTK87pizj-ZoB8pgwu8g_YRU_iTADyX8HUzp-4z1L56Q4oOit133fJJEwkcjE_HhAqmKg-4RpjEKTxg_d2wLdVO_iACOfdpeLHtLcfuOfNoez02KFeigVFBNtBUXsS_PqEo"/>
<!-- Speech Bubble -->
<div class="absolute -top-4 -right-12 bg-[#FDF9E7] border-2 border-[#F4CE1A] rounded-2xl p-4 shadow-lg animate-bounce w-48 z-30">
<p class="font-body-md text-body-md text-on-background text-center">Excellent travail ! Tu es sur la bonne voie.</p>
<div class="absolute -bottom-3 left-6 w-4 h-4 bg-[#FDF9E7] border-b-2 border-r-2 border-[#F4CE1A] transform rotate-45"></div>

<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profil</span>
</a>
</nav>
<script>
        // Radar Chart Initialization
        document.addEventListener("DOMContentLoaded", function() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Algèbre', 'Géométrie', 'Probabilités', 'Fonctions', 'Suites'],
                    datasets: [{
                        label: 'Niveau Actuel',
                        data: [90, 45, 80, 85, 75],
                        backgroundColor: 'rgba(244, 206, 26, 0.4)', // primary-container with opacity
                        borderColor: '#705d00', // primary
                        pointBackgroundColor: '#8d3c9a', // secondary
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: '#8d3c9a',
                        borderWidth: 2
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: {
                                color: '#e5e2e1' // surface-variant
                            },
                            grid: {
                                color: '#e5e2e1'
                            },
                            pointLabels: {
                                color: '#4d4632', // on-surface-variant
                                font: {
                                    family: 'Lexend',
                                    size: 12,
                                    weight: 500
                                }
                            },
                            ticks: {
                                display: false,
                                max: 100,
                                min: 0
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    responsive: true,
                    maintainAspectRatio: false
                }
            });

            // Simple Confetti Effect (Desktop mostly as mobile might lag)
            const confettiContainer = document.getElementById('confetti-container');
            const colors = ['#F4CE1A', '#8D3C9A', '#705d00', '#f59aff'];
            
            for(let i=0; i<30; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confettiContainer.appendChild(confetti);
            }
        });
    </script>
</body></html>
