<!doctype html>

<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Mentora - Préparation Examen</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link

      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">

        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'on-secondary-fixed-variant': '#722180',

              'on-error-container': '#93000a',

              'error-container': '#ffdad6',

              'tertiary-container': '#d4d1c0',
              secondary: '#8d3c9a',

              primary: '#705d00',

              'inverse-primary': '#e9c403',
              'surface-dim': '#dcd9d9',
              'primary-container': '#f4ce1a',

              'on-surface': '#1c1b1b',

    <style>
      body {
        font-family: 'Lexend', sans-serif;
      }
      .tactile-button-primary {
        background-color: #f4ce1a;
        color: #1a1a1a;
        border-bottom: 4px solid #c2a415;
        transition: all 0.1s ease;
      }
      .tactile-button-primary:active {
        border-bottom: 0px solid #c2a415;
        transform: translateY(4px);
      }
      .tactile-button-secondary {
        border: 2px solid #873694;
        color: #873694;
        background-color: transparent;
        border-bottom: 4px solid #873694;
        transition: all 0.1s ease;
      }
      .tactile-button-secondary:active {
        border-bottom: 2px solid #873694;
        transform: translateY(2px);
      }
      .card-tactile {
        border: 2px solid #e5e2e1;
        box-shadow: 0 4px 0 #e5e2e1;
        transition: all 0.1s ease;
      }
      .card-tactile:active {
        box-shadow: 0 0px 0 #e5e2e1;
        transform: translateY(4px);
      }
      .speech-bubble {
        background-color: #fdf9e7;
        border: 2px solid #f4ce1a;
        position: relative;
      }
      .speech-bubble::before {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 20px;
        border-width: 10px 10px 0;
        border-style: solid;
        border-color: #f4ce1a transparent transparent transparent;
        display: block;
        width: 0;
      }
      .speech-bubble::after {
        content: '';
        position: absolute;
        bottom: -7px;
        left: 22px;
        border-width: 8px 8px 0;
        border-style: solid;
        border-color: #fdf9e7 transparent transparent transparent;
        display: block;
        width: 0;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-background text-on-background min-h-screen pb-24">
    <!-- TopAppBar -->
    <header
      class="bg-background px-container-padding py-base sticky top-0 z-40 mx-auto flex w-full max-w-[720px] items-center justify-between"
    >
      <div class="gap-sm flex items-center">
        <div
          class="bg-surface-container-high border-outline-variant flex h-10 w-10 items-center justify-center overflow-hidden rounded-full border-2"
        >
          <img
            class="h-full w-full object-cover"
            data-alt="A friendly, expressive robot assistant avatar with a modern, clean design style. Bright yellow and purple accents on a light background. 3D rendered style with soft lighting."
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjvjJmyHNFDFO2lQmGqm_R0hnbwfoO3lECo_mpKv5Hjd4ulUMocq54dAXFP55luktKsClKUZ2wX9SA-34W40HrMkpTw08sAJxltywVgFyKSmi1XcL9A-L7E3EuAewdE6RT5iIB8ugX1-4CnjrBM1M8x5ay55DkFZwu8Qee9QtaXDAi5v2MqrmA2_eWNs0TmT-g9KsXOVRclvwv_27RoSq8CiNsK7pvHECzVp8J9K4vWe1sHhCIyZw"
          />
        </div>
        <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">
          Mentora
        </h1>
      </div>
      <button class="text-primary p-2 transition-all duration-200 hover:opacity-80 active:scale-95">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0"
          >notifications</span
        >
      </button>
    </header>
    <main class="px-container-padding mt-md gap-lg mx-auto flex max-w-[720px] flex-col">
      <!-- Header Section -->
      <section class="gap-stack-gap mt-md flex flex-col items-center text-center">
        <h2 class="font-headline-xl text-headline-xl text-on-surface">Prêt pour le Grand Jour ?</h2>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm">
          Le BAC approche à grands pas. C'est le moment de consolider tes acquis.
        </p>
      </section>
      <!-- Countdown Card -->
      <section
        class="card-tactile bg-surface-container-lowest p-md gap-sm flex flex-col items-center justify-center rounded-xl text-center"
      >
        <span class="font-label-lg text-label-lg text-secondary tracking-widest uppercase"
          >Compte à rebours BAC</span
        >
        <div class="gap-xs text-primary-container flex items-baseline">
          <span
            class="font-headline-xl text-6xl font-extrabold tracking-tighter"
            style="color: #705d00"
            >12</span
          >
          <span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface-variant"
            >Jours</span
          >
        </div>
        <div class="bg-surface-container-high mt-2 h-3 w-full overflow-hidden rounded-full">
          <div class="bg-primary-container h-full w-[85%] rounded-full"></div>
        </div>
        <p class="font-label-sm text-label-sm text-on-surface-variant mt-1">
          Dernière ligne droite, tu peux le faire !
        </p>
      </section>
      <!-- Mascot & Speech Bubble -->
      <section
        class="gap-md mt-sm flex flex-col items-center justify-center md:flex-row md:items-end"
      >
        <div
          class="speech-bubble p-sm px-md mb-4 max-w-xs rounded-2xl text-center shadow-sm md:order-2 md:mb-0 md:text-left"
        >
          <p class="font-body-lg text-body-lg text-on-surface">
            "Je suis là pour t'aider à cibler tes révisions. On commence par quoi aujourd'hui ?"
          </p>
        </div>
        <div class="h-32 w-32 flex-shrink-0 md:order-1 md:h-40 md:w-40">
          <img
            class="h-full w-full object-contain drop-shadow-lg"
            data-alt="A 3D render of a cheerful, encouraging robot mascot pointing upwards. The robot has a smooth white body with vibrant yellow and purple details, standing against a clean, light background."
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBwN4QWbLKTMeIGRM0g3SV8TyzgzmQLNFu0MY6yXUQPIgXkYTCJO6uUJCu18ejrNo6mzyXy7FaTosVVsKE_PdW_UkuvLsTlyUGwMwbsYIewT9wxN6uPRPxvErE8_GR13cCOHoIkG4AQxGDECLroL_MnD-SDk3FIELuPyjuwsLT_MC5psaUgDV3IIMvFKs-fCI8aYbrLxuZB5mHJy9-S9tKLVdAn6Cod8CmREPy0ypbBxOwz5fRQDwE"
          />
        </div>
      </section>
      <!-- Action Cards -->
      <section class="gap-stack-gap mt-sm grid grid-cols-1 md:grid-cols-2">
        <button
          class="tactile-button-primary p-md gap-sm group flex w-full flex-col items-center justify-center rounded-xl text-center"
        >
          <div
            class="bg-surface-container-lowest bg-opacity-30 flex h-12 w-12 items-center justify-center rounded-full transition-transform group-hover:scale-110"
          >
            <span
              class="material-symbols-outlined text-3xl"
              style="font-variation-settings: 'FILL' 1"
              >edit_document</span
            >
          </div>
          <div class="flex flex-col gap-1">
            <span class="font-headline-lg-mobile text-headline-lg-mobile font-bold"
              >Lancer un Examen Blanc</span
            >
            <span class="font-body-md text-body-md opacity-80">Conditions réelles, 3 heures.</span>
          </div>
        </button>
        <button
          class="tactile-button-secondary p-md gap-sm group flex w-full flex-col items-center justify-center rounded-xl text-center"
        >
          <div
            class="bg-secondary bg-opacity-10 text-secondary flex h-12 w-12 items-center justify-center rounded-full transition-transform group-hover:scale-110"
          >
            <span
              class="material-symbols-outlined text-3xl"
              style="font-variation-settings: 'FILL' 1"
              >troubleshoot</span
            >
          </div>
          <div class="flex flex-col gap-1">
            <span class="font-headline-lg-mobile text-headline-lg-mobile font-bold"
              >Revoir mes Points Faibles</span
            >
            <span class="font-body-md text-body-md opacity-80"
              >Focus sur tes erreurs récentes.</span
            >
          </div>
        </button>
      </section>
    </main>
    <!-- BottomNavBar -->
    <nav
      class="bg-surface fixed bottom-0 left-0 z-50 flex w-full items-center justify-around px-4 pt-2 pb-4 shadow-lg md:hidden"
    >
      <button
        class="text-on-surface-variant hover:bg-surface-container-low flex flex-col items-center justify-center rounded-xl px-4 py-1 transition-transform duration-200 active:translate-y-0.5"
      >
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0"
          >home</span
        >
        <span class="font-label-sm text-label-sm mt-1">Home</span>
      </button>
      <button
        class="bg-primary-container text-on-primary-container hover:bg-surface-container-low flex flex-col items-center justify-center rounded-xl px-4 py-1 transition-transform duration-200 active:translate-y-0.5"
      >
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1"
          >analytics</span
        >
        <span class="font-label-sm text-label-sm mt-1">Diagnostic</span>
      </button>
      <button
        class="text-on-surface-variant hover:bg-surface-container-low flex flex-col items-center justify-center rounded-xl px-4 py-1 transition-transform duration-200 active:translate-y-0.5"
      >
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0"
          >history_edu</span
        >
        <span class="font-label-sm text-label-sm mt-1">Revision</span>
      </button>
      <button
        class="text-on-surface-variant hover:bg-surface-container-low flex flex-col items-center justify-center rounded-xl px-4 py-1 transition-transform duration-200 active:translate-y-0.5"
      >
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0"
          >person</span
        >
        <span class="font-label-sm text-label-sm mt-1">Profile</span>
      </button>
    </nav>
  </body>
</html>
